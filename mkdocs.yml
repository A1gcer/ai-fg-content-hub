site_name: AI不翻车FAQ / AI-FG
site_description: 面向职场人的 AI 交付安全与质量控制知识库
site_author: A1gcer
site_url: https://a1gcer.github.io/ai-fg-content-hub/
repo_url: https://github.com/A1gcer/ai-fg-content-hub
edit_uri: edit/main/content/

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

extra_javascript:
  - js/copy-button.js

plugins:
  - search:
      lang: zh

nav:
  - 首页: index.md
  - 📋 Prompt库: prompts/index.md
  - 分类: categories/index.md
  - 标签: tags/index.md
  - 时间线: timeline/index.md
  - 风险: risk/index.md
