name: CI
on:
  pull_request:
    branches: [main]
    paths:
      - "content/**"
      - "scripts/**"
      - "README.md"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - run: python3 scripts/validate-content.py
      - run: python3 scripts/build-index.py
