name: Distribution CI

on:
  pull_request:
    branches: [main]
    paths:
      - "content/**"
      - "scripts/**"
      - "README.md"
      - "SKILL_DISTRIBUTION.md"

jobs:
  distribution-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install pyyaml

      - name: Validate content
        run: python3 scripts/validate-content.py

      - name: Validate distribution fields
        run: python3 scripts/validate-distribution.py

      - name: Build index/pages/distribution
        run: |
          python3 scripts/build-index.py
          python3 scripts/build-pages.py
          python3 scripts/build-distribution.py
          python3 scripts/build-distribution-index.py

      - name: Build GEO + README
        run: |
          python3 scripts/build-llms.py
          python3 scripts/build-sitemap.py
          python3 scripts/build-readme.py
